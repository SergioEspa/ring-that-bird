<div class="container">
    <div class="row my-4 justify-content-center">
        <div class="col-5 d-flex justify-content-center align-items-center">
            <div id="registerCard" class="card p-4 shadow rounded-3 mx-auto w-100 my-4">
                <h2 class="text-center my-4">Registrarse</h2>
                <form id="registerForm">
                    <div class="mb-3">
                        <label for="name" class="form-label">Nombre completo</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Registrarse</button>
                </form>
            </div>
        </div>
        <div class="col-5 d-flex justify-content-center align-items-center">
            <div id="loginCard" class="col-6 card p-4 shadow rounded-3 mx-auto w-100 my-4">
                <h2 class="text-center my-4">Iniciar sesión</h2>
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Iniciar sesión</button>
                </form>
            </div>
        </div>
    </div>
</div>
