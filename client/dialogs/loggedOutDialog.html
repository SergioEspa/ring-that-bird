<div class="modal fade" id="loggedOutModal" tabindex="-1" aria-labelledby="loggedOutModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content rounded-3 shadow">
      
        <!-- Header -->
        <div class="modal-header">
            <h5 class="modal-title" id="loggedOutModalLabel">Sesión cerrada</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar" id="cross-close-logged-out"></button>
        </div>
        
        <!-- Body -->
        <div class="modal-body">
            <p>Hemos cerrado tu sesión. Si deseas volver a iniciar sesión, por favor ingresa tus credenciales nuevamente.</p>
        </div>
        <!-- Footer -->
        <div class="modal-footer">
            <button type="button" class="btn btn-success" data-bs-dismiss="modal" id="accept-logged-out-btn">Aceptar</button>
        </div>
    </div>
    </div>
</div>
