<div class="modal fade" id="addBirdModal" tabindex="-1" aria-labelledby="addBirdModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-3 shadow">
      
        <div class="modal-header">
            <div>
                <h5 class="modal-title" id="locationModalLabel">Añadir anillamiento</h5>
                <small class="text-muted" id="stepIndicator">Paso 1 de 3: Identidad</small>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar" id="cross-close-bird-dialog"></button>
        </div>
        
        <div class="modal-body">
            <form id="addBirdForm">
                
                <div id="step1" class="form-step">
                    <div class="mb-3">
                        <label for="species" class="form-label">Especie</label>
                        <input type="text" class="form-control" id="species" name="species" placeholder="Ej: Colirrojo tizón" required>
                        <div id="suggestionsDialog" class="list-group position-absolute w-100" style="z-index: 1000;"></div>
                    </div>

                    <div class="mb-3">
                        <label for="sciName" class="form-label">Nombre científico</label>
                        <label id="sciName" name="sciName" class="form-control-plaintext text-muted fst-italic">Seleccione una opción arriba</label>
                    </div>
                    
                    <div class="mb-3">
                        <label for="remitente" class="form-label">Remitente</label>
                        <select class="form-select" id="remitente" name="remitente" required></select>
                    </div>

                    <div class="mb-3">
                        <label for="ringNumber" class="form-label">Número de anilla</label>
                        <input type="text" class="form-control" id="ringNumber" name="ringNumber" placeholder="Ej: 12" required>
                    </div>

                    <div class="mb-3">
                        <label for="station" class="form-label">Estación</label>
                        <input type="text" class="form-control" id="station" name="station" placeholder="Ej: RIRI" required>
                    </div>
                </div>

                <div id="step2" class="form-step d-none">
                    <div class="mb-3">
                        <label for="sex" class="form-label">Sexo</label>
                        <select class="form-select" id="sex" name="sex" required>
                            <option value="" selected>Selecciona</option>
                            <option value="macho">Macho</option>
                            <option value="hembra">Hembra</option>
                            <option value="desconocido">Desconocido</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="age" class="form-label">Edad</label>
                        <select class="form-select" id="age" name="age" required>
                            <option value="" selected>Selecciona</option>
                            <option value="juvenil">Juvenil</option>
                            <option value="adulto">Adulto</option>
                            <option value="desconocido">Desconocido</option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label for="weight" class="form-label">Peso (g)</label>
                            <input type="number" class="form-control" id="weight" name="weight" placeholder="Ej: 15" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label for="maxWingspan" class="form-label">Ala (mm)</label>
                            <input type="number" class="form-control" id="maxWingspan" name="maxWingspan" placeholder="Ej: 6.4" required>
                        </div>
                    </div>
                </div>

                <div id="step3" class="form-step d-none">
                     <div class="row">
                        <div class="col-6 mb-3">
                            <label for="thirdPrimary" class="form-label">3ª Primaria (mm)</label>
                            <input type="number" class="form-control" id="thirdPrimary" name="thirdPrimary" placeholder="Ej: 78" required>
                        </div>
                        <div class="col-6 mb-3">
                            <label for="underskinFat" class="form-label">Grasa (1-9)</label>
                            <input type="number" class="form-control" id="underskinFat" name="underskinFat" placeholder="Ej: 6" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="muscle" class="form-label">Músculo (0-3)</label>
                        <input type="number" class="form-control" id="muscle" name="muscle" placeholder="Ej: 3" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="notes" class="form-label">Observaciones</label>
                        <textarea class="form-control" id="notes" name="notes" rows="2" placeholder="Notas adicionales..."></textarea>
                    </div>
                    
                    <div class="mb-3 text-center">
                        <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#divExtraInfoBirds" aria-expanded="false" aria-controls="divExtraInfoBirds">
                            <i class="bi bi-chevron-down"></i> Mostrar métricas avanzadas
                        </button>
                    </div>
                    
                    <div class="collapse mb-3" id="divExtraInfoBirds">
                        <div class="card card-body bg-light">
                            <div class="row">
                                <div class="col-6 mb-2">
                                    <label for="tail" class="form-label small">Cola (mm)</label>
                                    <input type="number" class="form-control form-control-sm" id="tail" name="tail" placeholder="Ej: 64">
                                </div>
                                <div class="col-6 mb-2">
                                    <label for="beak" class="form-label small">Pico (mm)</label>
                                    <input type="number" class="form-control form-control-sm" id="beak" name="beak" placeholder="Ej: 10">
                                </div>
                                <div class="col-6 mb-2">
                                    <label for="tarsus" class="form-label small">Tarso (mm)</label>
                                    <input type="number" class="form-control form-control-sm" id="tarsus" name="tarsus" placeholder="Ej: 20">
                                </div>
                                <div class="col-6 mb-2">
                                    <label for="broodPatch" class="form-label small">Placa Incubatriz (0-5)</label>
                                    <input type="number" class="form-control form-control-sm" id="broodPatch" name="broodPatch">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer d-flex justify-content-between">
                    <button type="button" class="btn btn-secondary" id="btnPrevStep" disabled>Atrás</button>
                    <div>
                        <button type="button" class="btn btn-secondary me-1" data-bs-dismiss="modal" id="cancelAddBird">Cancelar</button>
                        <button type="button" class="btn btn-primary" id="btnNextStep">Siguiente</button>
                        <button type="submit" class="btn btn-success d-none" id="acceptAddBird">Guardar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
  </div>
</div>
