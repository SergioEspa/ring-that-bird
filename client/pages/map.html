<div id="map" class="w-100 h-100">
    <button id="add-bird-btn" class="btn btn-primary position-absolute bottom-0 end-0 m-4">
        <i class="bi bi-plus-lg me-2"></i> Añadir Anillamiento
    </button>
    <div class="position-absolute bottom-0 start-0 m-4 dropup" style="z-index: 1000 !important;">
        <button type="button" class="btn btn-warning shadow rounded-pill px-4" data-bs-toggle="dropdown" aria-expanded="false" data-bs-auto-close="outside">
            <i class="bi bi-funnel-fill me-2"></i> Filtrar
        </button>

        <div class="dropdown-menu p-3 shadow-lg rounded-4 border-0 mb-1" style="width: 320px;">
            
            <div class="mb-1">
                <label class="form-label small fw-bold text-muted">Especie</label>
                <div class="input-group input-group-sm position-relative">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-search"></i></span>
                    <input type="text" id="filterSpecies" class="form-control border-start-0" placeholder="Ej: Curruca...">
                    <div id="suggestions" 
                        class="list-group position-absolute start-0 w-100 shadow-sm" 
                        style="z-index: 1050; top: 100%; max-height: 200px; overflow-y: auto; display: none;">
                    </div>
                </div>
            </div>
            
            <div class="mb-1">
                <label class="form-label small fw-bold text-muted">Rango de fechas</label>
                <div class="input-group input-group-sm">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-calendar-range"></i></span>
                    <input type="text" id="filterDateRange" class="form-control bg-white border-start-0" placeholder="Seleccionar periodo..." readonly>
                </div>
            </div>

            <div class="mb-1">
                <label class="form-label small fw-bold text-muted">Estación</label>
                <div class="input-group input-group-sm">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-house"></i></span>
                    <input type="text" id="filterStations" class="form-control border-start-0" placeholder="Ej: RIRI...">
                </div>
            </div>
            
            <div class="mb-2">
                <div class="row g-2">
                    <div class="col-6">
                        <label class="form-label small fw-bold text-muted">Sexo</label>
                        <div class="btn-group w-100" role="group">
                            <input type="checkbox" class="btn-check" id="macho" autocomplete="off">
                            <label class="btn btn-outline-primary btn-sm" for="macho" title="Macho"><i class="bi bi-gender-male"></i></label>

                            <input type="checkbox" class="btn-check" id="hembra" autocomplete="off">
                            <label class="btn btn-outline-danger btn-sm" for="hembra" title="Hembra"><i class="bi bi-gender-female"></i></label>
                            
                            <input type="checkbox" class="btn-check" id="desconocido" autocomplete="off">
                            <label class="btn btn-outline-secondary btn-sm" for="desconocido" title="Indeterminado">?</label>
                        </div>
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-bold text-muted">Edad</label>
                        <div class="btn-group w-100" role="group">
                            <input type="checkbox" class="btn-check" id="juvenil" autocomplete="off">
                            <label class="btn btn-outline-success btn-sm" for="juvenil">Juv</label>

                            <input type="checkbox" class="btn-check" id="adulto" autocomplete="off">
                            <label class="btn btn-outline-dark btn-sm" for="adulto">Ad</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mb-1">
                <label class="form-label small fw-bold text-muted">Grasa (0-9)</label>
                <div id="slider-fat" class="mb-2"></div>
                <div class="d-flex justify-content-between extra-small text-muted" style="font-size: 0.8rem;">
                    <span id="fat-val-min">0</span>
                    <span id="fat-val-max">9</span>
                </div>
            </div>

            <div class="mb-1">
                <label class="form-label small fw-bold text-muted">Músculo (0-3)</label>
                <div id="slider-muscle" class="mb-2"></div>
                <div class="d-flex justify-content-between extra-small text-muted" style="font-size: 0.8rem;">
                    <span id="muscle-val-min">0</span>
                    <span id="muscle-val-max">3</span>
                </div>
            </div>

            <div class="mb-1">
                <div class="col-auto">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="otherUserRingings">
                        <label class="form-check-label small fw-bold text-muted" for="otherUserRingings">
                            Mostrar anillamientos ajenos
                        </label>
                    </div>
                </div>
            </div>
            
            <hr class="dropdown-divider">

            <div class="d-flex gap-2">
                <button class="btn btn-secondary btn-sm flex-grow-1 rounded-pill border-0" id="clearFiltersBtn">Limpiar</button>
                <button class="btn btn-primary btn-sm flex-grow-1 rounded-pill border-0" id="applyFiltersBtn">Aplicar</button>
            </div>
        </div>
    </div>
</div>
